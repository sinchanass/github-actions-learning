name: Example - Service container

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-web:
    runs-on: ubuntu-latest
    services:
      web:
        image: nginx:1.27-alpine
        ports:
          - 8080:80
    steps:
      - name: Request the service from the runner
        run: curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8080
